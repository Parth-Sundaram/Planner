<!doctype html>
<html><head><meta charset="utf-8" /><link rel="stylesheet" href="style.css" /></head>
<body>
  <h1>Add to Planner</h1>
  <form id="f">
    <label>Task <input id="text" placeholder="Review PR by Friday ~1h" autofocus /></label>
    <div class="hint">Write the date and time in plain words: "by Friday", "tomorrow 5pm", "every Sunday".</div>
    <label>Area <select id="area"><option value="">Auto</option></select></label>
    <label>Notes <textarea id="notes" rows="4"></textarea></label>
    <button id="go">Add</button>
    <div id="msg" class="msg"></div>
  </form>
  <script type="module" src="popup.js"></script>
</body></html>
